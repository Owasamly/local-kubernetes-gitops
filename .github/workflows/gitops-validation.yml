name: GitOps Validation and Security

on:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "argocd/**"
      - "charts/**"
      - "cluster/**"
      - "security/**"
      - ".github/workflows/gitops-validation.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "app/**"
      - "argocd/**"
      - "charts/**"
      - "cluster/**"
      - "security/**"
      - ".github/workflows/gitops-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: gitops-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-validation:
    name: Helm Lint and Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.21.3

      - name: Validate bootstrap shell syntax
        run: bash -n cluster/bootstrap.sh cluster/verify.sh cluster/destroy.sh

      - name: Lint Helm chart
        run: helm lint charts/demo-app --strict

      - name: Render Kubernetes manifests
        run: |
          mkdir -p .rendered
          helm template demo-app charts/demo-app \
            --namespace demo \
            --values charts/demo-app/values.yaml \
            > .rendered/demo-app.yaml

      - name: Validate rendered manifests with Kubeconform
        run: |
          docker run --rm \
            -v "${PWD}/.rendered:/manifests:ro" \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict \
            -summary \
            -kubernetes-version 1.35.0 \
            /manifests/demo-app.yaml

      - name: Upload rendered manifest
        uses: actions/upload-artifact@v7
        with:
          name: rendered-demo-app-manifest
          path: .rendered/demo-app.yaml
          retention-days: 14

  kubernetes-security:
    name: Kubernetes Configuration Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.21.3

      - name: Render manifests for security analysis
        run: |
          mkdir -p .rendered
          helm template demo-app charts/demo-app \
            --namespace demo \
            --values charts/demo-app/values.yaml \
            > .rendered/demo-app.yaml

      # Reporting pass: always produces SARIF for GitHub Code Scanning.
      - name: Generate Trivy configuration SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .rendered
          format: sarif
          output: trivy-config-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload configuration findings to GitHub Code Scanning
        if: always() && hashFiles('trivy-config-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-kubernetes-config

      # Enforcement pass: fails the job when high or critical issues remain.
      - name: Enforce Kubernetes security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .rendered
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-setup-trivy: true

  container-security:
    name: Container Build and Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build local demo image
        run: docker build --tag demo-app:${{ github.sha }} app

      # Reporting pass: preserve all high and critical findings as SARIF.
      - name: Generate Trivy image SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: demo-app:${{ github.sha }}
          format: sarif
          output: trivy-image-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          limit-severities-for-sarif: true

      - name: Upload image findings to GitHub Code Scanning
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-container-image

      # Critical findings with available fixes block the pipeline.
      - name: Enforce critical image vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: demo-app:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
